<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel do Investidor</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  margin: 0;
  padding: 20px;
}
h1 { text-align: center; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
  margin-top: 30px;
}

.card {
  background: #1e293b;
  padding: 18px;
  border-radius: 12px;
  transition: 0.3s;
}

.card:hover { transform: scale(1.03); }

.positive { color: #22c55e; }
.negative { color: #ef4444; }

button {
  margin-top: 8px;
  padding: 6px 10px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.ri-btn { background: #2563eb; color: white; }

.summary {
  margin-bottom: 30px;
}
</style>
</head>
<body>

<h1>Painel Estratégico de Investimentos</h1>

<div class="summary" id="summary"></div>
<div class="grid" id="stocks"></div>

<script>

const companies = {
"BBAS3": "https://ri.bb.com.br",
"ITUB4": "https://www.itau.com.br/relacoes-com-investidores/",
"BBDC4": "https://ri.bradesco.com.br",
"CMIG4": "https://ri.cemig.com.br",
"SANB4": "https://ri.santander.com.br",
"BPAC5": "https://ri.btgpactual.com",
"VIVT3": "https://ri.telefonica.com.br",
"TIMS3": "https://ri.tim.com.br",
"DASA3": "https://ri.dasa.com.br",
"FESA4": "https://ri.ferbasa.com.br",
"RADL3": "https://ri.rd.com.br",
"PSSA3": "https://ri.portoseguro.com.br",
"EGIE3": "https://ri.engie.com.br",
"CPLE3": "https://ri.copel.com",
"CXSE3": "https://ri.caixaseguridade.com.br"
};

async function load() {

  const tickers = Object.keys(companies).join(",");
  const response = await fetch(`https://brapi.dev/api/quote/${tickers}`);
  const data = await response.json();

  const container = document.getElementById("stocks");
  const summary = document.getElementById("summary");

  let totalYTD = 0;

  data.results.forEach(stock => {

    const ytd = stock.regularMarketChangePercent;
    totalYTD += ytd;

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <h3>${stock.symbol}</h3>
      <p>Preço: R$ ${stock.regularMarketPrice.toFixed(2)}</p>
      <p>YTD: <span class="${ytd >= 0 ? "positive":"negative"}">
        ${ytd.toFixed(2)}%
      </span></p>
      <button class="ri-btn" onclick="window.open('${companies[stock.symbol]}','_blank')">
        Página RI
      </button>
    `;

    container.appendChild(div);
  });

  const carteiraYTD = (totalYTD / data.results.length).toFixed(2);

  summary.innerHTML = `
    <h2>📊 Performance da Carteira (Peso Igual)</h2>
    <h3 class="${carteiraYTD >= 0 ? "positive":"negative"}">
      YTD Carteira: ${carteiraYTD}%
    </h3>
  `;
}

load();

</script>

</body>
</html>
