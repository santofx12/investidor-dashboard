<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard do Investidor</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

header {
  padding: 20px;
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  background: #1e293b;
}

.subinfo {
  text-align: center;
  margin-bottom: 20px;
  opacity: 0.7;
}

#stocks {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 12px;
  transition: transform 0.2s ease;
}

.card:hover {
  transform: scale(1.03);
}

.positive {
  color: #22c55e;
}

.negative {
  color: #ef4444;
}
</style>
</head>

<body>

<header>
  Dashboard do Investidor
</header>

<div class="subinfo" id="updateInfo"></div>

<div id="stocks"></div>

<script>
async function load() {
  const res = await fetch('./data.json');
  const data = await res.json();

  document.getElementById('updateInfo').innerText =
    "Última atualização: " + data.lastUpdate;

  const container = document.getElementById('stocks');
  container.innerHTML = '';

  data.stocks.forEach(stock => {

    const ytdClass = stock.ytd >= 0 ? "positive" : "negative";

    const div = document.createElement('div');
    div.className = 'card';

    div.innerHTML = `
      <h2>${stock.symbol}</h2>
      <p>Preço: R$ ${stock.price.toFixed(2)}</p>
      <p class="${ytdClass}">YTD: ${stock.ytd}%</p>
      <p>Próx. Dividendo: ${stock.dividendDate}</p>
    `;

    container.appendChild(div);
  });
}

load();
</script>

</body>
</html>
