<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel do Investidor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  margin: 0;
  padding: 20px;
}
h1 { text-align: center; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
  margin-top: 30px;
}

.card {
  background: #1e293b;
  padding: 18px;
  border-radius: 12px;
  transition: 0.3s;
}

.card:hover { transform: scale(1.03); }

.positive { color: #22c55e; }
.negative { color: #ef4444; }

button {
  margin-top: 8px;
  padding: 6px 10px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.ri-btn { background: #2563eb; color: white; }
.result-btn { background: #14b8a6; color: white; }

#details {
  margin-top: 50px;
}

canvas {
  background: white;
  border-radius: 10px;
  padding: 10px;
}
</style>
</head>
<body>

<h1>Painel Estratégico de Investimentos</h1>

<div class="grid" id="stocks"></div>
<div id="details"></div>

<script>

const companies = {
"BBAS3.SA": "https://ri.bb.com.br",
"ITUB4.SA": "https://www.itau.com.br/relacoes-com-investidores/",
"BBDC4.SA": "https://ri.bradesco.com.br",
"CMIG4.SA": "https://ri.cemig.com.br",
"SANB4.SA": "https://ri.santander.com.br",
"BPAC5.SA": "https://ri.btgpactual.com",
"VIVT3.SA": "https://ri.telefonica.com.br",
"TIMS3.SA": "https://ri.tim.com.br",
"DASA3.SA": "https://ri.dasa.com.br",
"FESA4.SA": "https://ri.ferbasa.com.br",
"RADL3.SA": "https://ri.rd.com.br",
"PSSA3.SA": "https://ri.portoseguro.com.br",
"EGIE3.SA": "https://ri.engie.com.br",
"CPLE3.SA": "https://ri.copel.com",
"CXSE3.SA": "https://ri.caixaseguridade.com.br"
};

async function fetchStock(ticker) {
  const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?range=1y&interval=1wk`);
  const data = await res.json();
  return data.chart.result[0];
}

function createCard(stockData, ticker) {
  const price = stockData.meta.regularMarketPrice;
  const prev = stockData.meta.previousClose;
  const change = ((price - prev) / prev * 100).toFixed(2);

  const div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
    <h3>${ticker.replace(".SA","")}</h3>
    <p>Preço Atual: R$ ${price.toFixed(2)}</p>
    <p class="${change >= 0 ? "positive":"negative"}">
      ${change}% hoje
    </p>
    <button class="ri-btn" onclick="window.open('${companies[ticker]}','_blank')">
      Página RI
    </button>
    <button class="result-btn" onclick="window.open('${companies[ticker]}/resultados','_blank')">
      Últimos Resultados
    </button>
  `;

  div.onclick = () => showDetails(stockData, ticker);

  return div;
}

function showDetails(stockData, ticker) {
  document.getElementById("details").innerHTML = `
    <h2>${ticker.replace(".SA","")} - Histórico 1 Ano</h2>
    <canvas id="chartCanvas" height="100"></canvas>
  `;

  const ctx = document.getElementById("chartCanvas");
  const prices = stockData.indicators.quote[0].close;
  const labels = stockData.timestamp.map(t =>
    new Date(t * 1000).toLocaleDateString()
  );

  new Chart(ctx, {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        label: "Preço",
        data: prices,
        borderWidth: 2
      }]
    }
  });
}

async function load() {
  const container = document.getElementById("stocks");
  for (let ticker in companies) {
    try {
      const data = await fetchStock(ticker);
      container.appendChild(createCard(data, ticker));
    } catch (e) {
      console.log("Erro em", ticker);
    }
  }
}

load();

</script>
</body>
</html>
