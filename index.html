<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard do Investidor</title>

<style>
body { margin:0; font-family:Arial; background:#0f172a; color:white; }
header { padding:20px; text-align:center; font-size:28px; background:#111827; }
.section { padding:20px; }
#stocks { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:20px; }

.card {
  background:#1f2937;
  padding:15px;
  border-radius:12px;
  cursor:pointer;
  transition:0.2s;
}
.card:hover { transform:scale(1.03); background:#273449; }

.positive { color:#22c55e; }
.negative { color:#ef4444; }

.badge {
  display:inline-block;
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  background:#374151;
  margin-top:5px;
}
</style>
</head>

<body>

<header>Dashboard do Investidor</header>

<div class="section" id="stocks"></div>

<script>
async function load() {
  const res = await fetch('./data.json');
  const data = await res.json();

  const container = document.getElementById('stocks');
  container.innerHTML = '';

  data.stocks.forEach(stock => {

    const ytdClass = stock.ytd >= 0 ? "positive" : "negative";

    const div = document.createElement('div');
    div.className = 'card';

    div.onclick = () => {
      window.location.href = "stock.html?symbol=" + stock.symbol;
    };

    div.innerHTML = `
      <h2>${stock.symbol}</h2>
      <p>Preço: R$ ${stock.price.toFixed(2)}</p>
      <p class="${ytdClass}">YTD: ${stock.ytd}%</p>
      <div class="badge">Próx. Div: ${stock.dividendDate}</div>
    `;

    container.appendChild(div);
  });
}

load();
</script>

</body>
</html>
