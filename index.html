<script>

const companies = {
"BBAS3": "https://ri.bb.com.br",
"ITUB4": "https://www.itau.com.br/relacoes-com-investidores/",
"BBDC4": "https://ri.bradesco.com.br",
"CMIG4": "https://ri.cemig.com.br",
"SANB4": "https://ri.santander.com.br",
"BPAC5": "https://ri.btgpactual.com",
"VIVT3": "https://ri.telefonica.com.br",
"TIMS3": "https://ri.tim.com.br",
"DASA3": "https://ri.dasa.com.br",
"FESA4": "https://ri.ferbasa.com.br",
"RADL3": "https://ri.rd.com.br",
"PSSA3": "https://ri.portoseguro.com.br",
"EGIE3": "https://ri.engie.com.br",
"CPLE3": "https://ri.copel.com",
"CXSE3": "https://ri.caixaseguridade.com.br"
};

async function load() {

  const response = await fetch("/api/quotes");
  const data = await response.json();

  const container = document.getElementById("stocks");

  let totalYTD = 0;

  data.quoteResponse.result.forEach(stock => {

    const price = stock.regularMarketPrice;
    const change = stock.regularMarketChangePercent;

    totalYTD += change;

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <h3>${stock.symbol.replace(".SA","")}</h3>
      <p>Preço: R$ ${price.toFixed(2)}</p>
      <p class="${change >= 0 ? "positive":"negative"}">
        ${change.toFixed(2)}%
      </p>
      <button class="ri-btn" onclick="window.open('${companies[stock.symbol.replace(".SA","")]}','_blank')">
        Página RI
      </button>
    `;

    container.appendChild(div);
  });

  const carteiraYTD = (totalYTD / data.quoteResponse.result.length).toFixed(2);

  const summary = document.createElement("div");
  summary.innerHTML = `
    <h2>📊 Performance da Carteira (Peso Igual)</h2>
    <h3 class="${carteiraYTD >= 0 ? "positive":"negative"}">
      ${carteiraYTD}%
    </h3>
  `;

  document.body.insertBefore(summary, container);
}

load();

</script>
