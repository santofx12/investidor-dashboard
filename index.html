<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard do Investidor</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      background: #1e293b;
    }

    #stocks {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .positive {
      color: #22c55e;
    }

    .negative {
      color: #ef4444;
    }
  </style>
</head>

<body>

<header>
  Dashboard do Investidor
</header>

<div id="stocks"></div>

<script>
async function load() {
  try {
    const res = await fetch('/api/quotes');
    const data = await res.json();

    console.log("API response:", data);

    const stocks = data.results || [];

    const container = document.getElementById('stocks');
    container.innerHTML = '';

    stocks.forEach(stock => {
      const change = stock.regularMarketChangePercent || 0;
      const changeClass = change >= 0 ? "positive" : "negative";

      const div = document.createElement('div');
      div.className = 'card';

      div.innerHTML = `
        <h2>${stock.symbol}</h2>
        <p>Preço: R$ ${stock.regularMarketPrice?.toFixed(2) || '-'}</p>
        <p class="${changeClass}">
          Variação: ${change.toFixed(2)}%
        </p>
        <p>Máx 52s: R$ ${stock.fiftyTwoWeekHigh?.toFixed(2) || '-'}</p>
        <p>Mín 52s: R$ ${stock.fiftyTwoWeekLow?.toFixed(2) || '-'}</p>
      `;

      container.appendChild(div);
    });

  } catch (err) {
    console.error("Erro ao carregar:", err);
    document.getElementById('stocks').innerHTML =
      "<p style='color:red'>Erro ao carregar dados.</p>";
  }
}

load();
</script>

</body>
</html>
