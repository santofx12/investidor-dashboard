<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard do Investidor</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

header {
  padding: 20px;
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  background: #1e293b;
}

.section {
  padding: 20px;
}

.summary {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.box {
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
  flex: 1;
  min-width: 200px;
}

#stocks {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 20px;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 12px;
  transition: transform 0.2s ease;
}

.card:hover {
  transform: scale(1.03);
}

button {
  margin-top: 10px;
  padding: 8px;
  background: #2563eb;
  border: none;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

.positive { color: #22c55e; }
.negative { color: #ef4444; }

.small {
  opacity: 0.6;
  font-size: 13px;
}
</style>
</head>

<body>

<header>Dashboard do Investidor</header>

<div class="section small" id="updateInfo"></div>

<div class="section">
  <h2>Resumo Geral</h2>
  <div class="summary" id="summary"></div>
</div>

<div class="section">
  <h2>Próximos Dividendos</h2>
  <div id="dividends"></div>
</div>

<div class="section">
  <h2>Empresas</h2>
  <div id="stocks"></div>
</div>

<script>
async function load() {
  const res = await fetch('./data.json');
  const data = await res.json();

  document.getElementById('updateInfo').innerText =
    "Última atualização: " + data.lastUpdate;

  const stocks = data.stocks;

  // ===== RESUMO =====
  const total = stocks.length;
  const positive = stocks.filter(s => s.ytd >= 0).length;
  const negative = total - positive;
  const avgYTD = (stocks.reduce((sum, s) => sum + s.ytd, 0) / total).toFixed(2);

  document.getElementById('summary').innerHTML = `
    <div class="box">Empresas: <strong>${total}</strong></div>
    <div class="box">Média YTD: <strong class="${avgYTD >= 0 ? 'positive':'negative'}">${avgYTD}%</strong></div>
    <div class="box">Positivas: <strong>${positive}</strong></div>
    <div class="box">Negativas: <strong>${negative}</strong></div>
  `;

  // ===== DIVIDENDOS =====
  const sortedDiv = [...stocks].sort((a,b) =>
    new Date(a.dividendDate) - new Date(b.dividendDate)
  );

  const divContainer = document.getElementById('dividends');
  divContainer.innerHTML = '';

  sortedDiv.forEach(stock => {
    divContainer.innerHTML += `
      <div class="box">
        ${stock.symbol} — ${stock.dividendDate}
      </div>
    `;
  });

  // ===== CARDS =====
  const container = document.getElementById('stocks');
  container.innerHTML = '';

  stocks.forEach(stock => {

    const ytdClass = stock.ytd >= 0 ? "positive" : "negative";

    const div = document.createElement('div');
    div.className = 'card';

    div.innerHTML = `
      <h2>${stock.symbol}</h2>
      <p>Preço: R$ ${stock.price.toFixed(2)}</p>
      <p class="${ytdClass}">YTD: ${stock.ytd}%</p>
      <p>Próx. Dividendo: ${stock.dividendDate}</p>
      <button onclick="window.open('https://ri.' + stock.symbol.toLowerCase() + '.com.br','_blank')">
        Página RI
      </button>
    `;

    container.appendChild(div);
  });
}

load();
</script>

</body>
</html>
