<script>
function generateHistory(base, current){
  let history=[]
  let today=new Date()
  for(let i=365;i>=0;i--){
    let d=new Date()
    d.setDate(today.getDate()-i)
    let variation=(Math.random()-0.5)*2
    base+=variation
    history.push({
      date:d.toISOString().split("T")[0],
      price:Number(base.toFixed(2))
    })
  }
  return history
}
</script>
